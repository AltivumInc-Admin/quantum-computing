AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Ask the margin — a response-streaming, Anthropic-backed lesson tutor for the
  quantum curriculum. A single stateless Lambda behind a Function URL.

# NOTE: abuse/cost monitoring has two layers. (1) Per-IP rate limiting is enforced
# at the edge by a CloudFront + WAFv2 rate-based rule (see edge.yaml, a separate
# us-east-1 stack); requests over the per-IP limit get a 429 before reaching this
# function. With OAC in front, set FunctionUrlAuthType=AWS_IAM so the raw Function
# URL cannot be hit directly, bypassing the edge. (2) ReservedConcurrentExecutions
# remains a hard ceiling on simultaneous billable invocations. The high-invocations
# alarm (Invocations Sum 1h >500) is now stack-managed below as
# HighInvocationsAlarm; its console-created predecessor "quantum-tutor-high-invocations"
# must be deleted manually after the first deploy of this version (see README /
# the PR runbook) — CloudFormation cannot adopt a live alarm by reusing its name.

Parameters:
  SecretId:
    Type: String
    Default: quantum-tutor
    Description: >
      Secrets Manager secret holding the Anthropic API key as {"apiKey": "..."}.
      The handler reads it on first model call with its own execution role, so
      the key never appears in the function's environment and is not visible via
      GetFunctionConfiguration.

      There is no ModelId parameter any more: model ids are the bare first-party
      strings in tutor-billing.mjs MODEL_IDS, chosen per request from the
      caller's tier. Amazon Bedrock never entitled this account to the paid
      models (sonnet-5, opus-5 and fable-5 all returned "not available for this
      account" from Converse while the availability API reported them
      AUTHORIZED), so every tier above free was unreachable there.
  AllowedOrigin:
    Type: String
    Default: https://quantum.altivum.ai
    Description: Origin allowed to call the Function URL (your site).
  MaxConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    Description: >
      Reserved concurrency — a HARD ceiling on simultaneous (billable)
      invocations. A second-layer cost control behind the edge WAF rate limit:
      excess requests are throttled rather than fanning out into unbounded paid
      model generations.
  FunctionUrlAuthType:
    Type: String
    Default: AWS_IAM
    AllowedValues: [AWS_IAM, NONE]
    Description: >
      Function URL auth. AWS_IAM (default, end state) locks the URL so ONLY the
      CloudFront Origin Access Control in edge.yaml can invoke it — closing the
      public bypass. NONE is used transiently during the cutover (front CloudFront
      first, verify, then flip to AWS_IAM). OAC REQUIRES AWS_IAM.
  LogRetentionInDays:
    Type: Number
    Default: 30
    # Only the values CloudWatch Logs accepts — constrain here so a bad value fails
    # fast at `sam validate` / change-set creation rather than mid-deploy with an
    # InvalidParameterException + rollback.
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: >
      CloudWatch Logs retention (days) for the function's log group, which is
      declared explicitly below so it is stack-managed with a finite retention
      instead of the Lambda-auto-created group's never-expire default.
  AlertEmail:
    Type: String
    Default: christian.perez@altivum.io
    Description: >
      Operator email for the human notification path. Receives every CloudWatch
      alarm in this stack. Each SNS email subscription must be confirmed once
      from the inbox before it delivers.
  WalletTableName:
    Type: String
    Default: ""
    Description: >
      Name of the quantum-stripe credit-wallet table (WALLET#<sub> rows,
      1 credit = $0.01). Empty = tutor metering disabled: the free Haiku path
      is untouched and any explicit paid-model request is refused in-band.
      Set (to quantum-stripe-wallet, together with the user-pool params below)
      to let paid tiers use the premium model roster, billed against the same
      wallet the QPU spend fence debits.
  UserPoolId:
    Type: String
    Default: ""
    Description: >
      The quantum-workspace Cognito user pool. The tutor is a streaming
      Function URL — no API Gateway JWT authorizer exists in front of it — so
      the handler verifies the caller's ID token in-process against this
      pool's JWKS (aws-jwt-verify). Empty = paid models require sign-in and
      always refuse; the anonymous free path never authenticates at all.
  RateCardSecret:
    Type: String
    Default: ""
    Description: >
      Name of the Secrets Manager secret holding the rate factor that converts
      provider cost into charged credits, as {"factor": "..."}. Empty (the
      default) = the RATE_CARD env var is ABSENT and metering stays off: paid
      models refuse, the free path is untouched. CloudFormation resolves the
      value at deploy time with the DEPLOYER's credentials — it never passes
      through a CLI argument or a samconfig, never lands in this repository
      (rule 6), and the function's execution role gets NO grant on it. The QPU
      stack reads the SAME secret through the SAME env key; every metered
      surface must convert at one shared factor (rule 5) — check-rate-parity
      proves the two deployed functions agree without printing the value.
  UserPoolClientId:
    Type: String
    Default: ""
    Description: The quantum-workspace-web app client (JWT audience).

Conditions:
  HasWalletTable: !Not [!Equals [!Ref WalletTableName, ""]]
  HasUserPool: !Not [!Equals [!Ref UserPoolId, ""]]
  # One condition per parameter, deliberately (see the USER_POOL_CLIENT_ID
  # lesson: two vars riding one condition reach half-on states).
  HasRateCard: !Not [!Equals [!Ref RateCardSecret, ""]]

Resources:
  TutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: quantum-tutor
      # nodejs22.x (LTS) — nodejs20.x reached end-of-life 2026-04-30 (no security patches).
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: ./
      MemorySize: 512
      Timeout: 60
      # HARD cost ceiling (second layer behind the edge WAF rate limit).
      ReservedConcurrentExecutions: !Ref MaxConcurrency
      # Cost-attribution tags on the Lambda's OWN compute only. The dominant
      # cost — model inference — is no longer on the AWS bill at all: it is
      # billed by Anthropic against the API key in SecretId. `make cost` and
      # Cost Explorer will therefore show tutor inference dropping to zero from
      # the cutover date; that is the provider move, not a usage collapse.
      Tags:
        Project: quantum
        Feature: ask-tutor
        CostCategory: genai
      Environment:
        Variables:
          SECRET_ID: !Ref SecretId
          WALLET_TABLE: !If [HasWalletTable, !Ref WalletTableName, !Ref AWS::NoValue]
          # Resolved at deploy time; the unselected branch is never resolved
          # (verified empirically against a nonexistent secret, 2026-08-17), so
          # the empty default deploys clean with the variable simply absent. A
          # typo'd secret name fails the DEPLOY, loudly — never a silent
          # mis-config. Value rotation = update the secret + redeploy.
          RATE_CARD: !If [HasRateCard, !Sub "{{resolve:secretsmanager:${RateCardSecret}:SecretString:factor}}", !Ref AWS::NoValue]
          USER_POOL_ID: !If [HasUserPool, !Ref UserPoolId, !Ref AWS::NoValue]
          USER_POOL_CLIENT_ID: !If [HasUserPool, !Ref UserPoolClientId, !Ref AWS::NoValue]
      Policies:
        # The provider credential. Scoped to the ONE secret by name — the
        # trailing -?????? matches the six random characters Secrets Manager
        # appends to every ARN, which are not known at deploy time. NOT
        # Resource "*": this role must not be able to read quantum-stripe's
        # live Stripe key, which lives in the same account.
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretId}-??????"
        # The credit wallet (metering): tier read, the pre-flight debit, and the
        # post-stream refund. When metering is off the !If collapses onto a
        # well-formed table ARN that does not exist, so the statement grants
        # nothing exercisable (a SAM Policies list item cannot itself be
        # conditional; a Resource can — the lambda/qpu idiom).
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !If
                - HasWalletTable
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WalletTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/quantum-tutor-metering-disabled
      FunctionUrlConfig:
        AuthType: !Ref FunctionUrlAuthType
        InvokeMode: RESPONSE_STREAM
        Cors:
          # CORS is a browser-enforced UX allowlist, NOT access control. The real
          # access control is AuthType AWS_IAM + the edge WAF (edge.yaml).
          # x-amz-content-sha256 is allowed so the browser's POST preflight passes
          # once OAC requires the body-hash header on POST.
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
            - x-amz-content-sha256
            # The Cognito ID token for paid-model requests. It rides a custom
            # header because Authorization is owned by the CloudFront OAC
            # SigV4 signature; the managed AllViewerExceptHostHeader origin
            # request policy (edge.yaml) forwards it to the origin unchanged.
            - x-tutor-auth
          # Without MaxAge the browser falls back to a 5s preflight cache, so
          # nearly every question pays an extra cross-region OPTIONS round trip
          # before the POST. One hour is safe: this allowlist changes only on a
          # stack deploy, which is exactly when a stale cache should expire.
          MaxAge: 3600

  # Stack-managed log group with a finite retention. Lambda otherwise auto-creates
  # /aws/lambda/<fn> with never-expire retention; declaring it here (the conventional
  # name) gives CloudFormation ownership + a retention policy.
  # ‼️ One-time import on the EXISTING stack: this function was deployed before the
  # group was in the template, so the group already exists and a plain deploy fails
  # "resource already exists". Do a CloudFormation resource IMPORT (preserves logs) or
  # delete the auto-created group first. See README → "Log retention (now in the template)".
  TutorLogGroup:
    Type: AWS::Logs::LogGroup
    # Retain the group (and its log history) on stack delete/replacement, AND so the
    # one-time resource IMPORT documented in the README is accepted: CloudFormation
    # REQUIRES a DeletionPolicy on every resource being imported.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Literal, NOT !Sub "/aws/lambda/${TutorFunction}": the group was adopted
      # into the stack via resource IMPORT, which stores the literal physical
      # name. CloudFormation compares the stored literal against a raw !Sub
      # expression, flags LogGroupName as changed (RequiresRecreation: Always),
      # and plans a REPLACEMENT that would fail on the existing name. The
      # function name is pinned (FunctionName: quantum-tutor), so the literal
      # can never drift from the resolved expression.
      LogGroupName: /aws/lambda/quantum-tutor
      RetentionInDays: !Ref LogRetentionInDays

  # ---- Human notification path (pattern proven in lambda/qpu/template.yaml) ----
  # NOT named "quantum-tutor-alerts": that topic already exists in this account,
  # created by hand for the old console-managed alarm. SNS CreateTopic is
  # idempotent by name, so CloudFormation would silently claim the live topic
  # (and delete it — with its confirmed subscriptions — on stack delete or
  # rollback). A distinct name keeps ownership unambiguous; the old topic can
  # be retired manually once nothing references it.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: quantum-tutor-stack-alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  # index.mjs streams inside a committed HTTP 200, so a model failure raises
  # neither the HTTP status nor the Lambda Errors metric; its only trace is the
  # console.error(JSON.stringify({ tutorError: true, ... })) line. This filter
  # turns that line into a metric. The pattern is a literal quoted term, NOT the
  # JSON selector { $.tutorError IS TRUE }: JSON selectors only match log events
  # that are valid JSON in full, and this function logs in Lambda's default text
  # format, which prefixes console.error output with timestamp/request-id — the
  # selector would never fire. template.test.mjs pins the term to the actual
  # emission in index.mjs, so the two cannot drift.
  TutorErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TutorLogGroup
      FilterPattern: '"tutorError"'
      MetricTransformations:
        - MetricNamespace: QuantumTutor
          MetricName: TutorError
          MetricValue: "1"
          Unit: Count

  TutorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-tutor-errors
      AlarmDescription: >-
        The tutor emitted at least one tutorError log line in 5 minutes — a
        model call failed after the 200 was committed, so learners saw the
        in-band error sentinel. Neither HTTP status nor Lambda Errors ever
        reflects this. Check the function's log group for the error detail.
      Namespace: QuantumTutor
      MetricName: TutorError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # index.mjs logs {"tutorCorpusMissing":true} when the corpus import fails. That
  # path is invisible to every other signal: the handler still returns HTTP 200
  # and streams OUT_OF_SCOPE_MESSAGE, so Lambda Errors stays flat and the tutor
  # is silently dead for EVERY learner on EVERY lesson. This is the only alarm
  # that can catch it.
  TutorCorpusMissingMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TutorLogGroup
      FilterPattern: '"tutorCorpusMissing"'
      MetricTransformations:
        - MetricNamespace: QuantumTutor
          MetricName: TutorCorpusMissing
          MetricValue: "1"
          Unit: Count

  TutorCorpusMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-tutor-corpus-missing
      AlarmDescription: >-
        The tutor could not load its grounding corpus, so it answers
        OUT_OF_SCOPE to every question on every lesson while still returning
        HTTP 200. Neither the Errors metric nor the status code reflects this.
        Redeploy: predeploy rebuilds the corpus and gates on its freshness.
      Namespace: QuantumTutor
      MetricName: TutorCorpusMissing
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # Stack-managed successor to the console-created "quantum-tutor-high-invocations"
  # alarm (same metric, statistic, period, and threshold — verified against the
  # live alarm before folding it in). The name is deliberately DIFFERENT:
  # PutMetricAlarm upserts by name, so reusing the existing name would either
  # fail stack creation ("resource already exists") or silently seize a resource
  # this stack did not create — and then delete it on rollback. Runbook: delete
  # the console alarm immediately after the first deploy of this version.
  # THE MIGRATION ALARM. index.mjs logs USAGE_SHAPE_UNRECOGNIZED when the
  # provider returns a usage report it cannot read — the failure a field rename
  # produces. Nothing else can see it: the answer streams normally, the response
  # is 200, Lambda Errors stays flat, and every generation simply prices to zero
  # credits. Metering would report success and bill nothing, indefinitely.
  #
  # This is not hypothetical. Amazon Bedrock spelled all four usage fields in
  # camelCase and Anthropic spells them in snake_case, so the un-migrated
  # handler would have hit exactly this. Threshold 0: one occurrence is a bug,
  # not noise.
  TutorUsageShapeMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TutorLogGroup
      FilterPattern: '"usage report shape unrecognized"'
      MetricTransformations:
        - MetricNamespace: QuantumTutor
          MetricName: TutorUsageShapeUnrecognized
          MetricValue: "1"
          Unit: Count

  TutorUsageShapeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-tutor-usage-shape-unrecognized
      AlarmDescription: >-
        The tutor received a token-usage report it could not read, so it charged
        0 credits for a paid generation. Almost certainly a provider field
        rename. Every metered request is currently free and no other signal
        shows it. Compare the logged `keys` against readUsage in
        tutor-billing.mjs.
      Namespace: QuantumTutor
      MetricName: TutorUsageShapeUnrecognized
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ---- reserve/settle pairing (the stranded-reservation sweep) --------------
  # Every metered generation logs tutorReserve at debit and tutorSettle at
  # settle. A reserve with no settle in the same hour means the process died
  # between the two — learner money silently held, the exact gap index.mjs's
  # own comment says nothing sweeps. A pair split across an hour boundary can
  # false-fire once; the alarm email says how to check.
  TutorReserveMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TutorLogGroup
      FilterPattern: '"tutorReserve"'
      MetricTransformations:
        - MetricNamespace: QuantumTutor
          MetricName: TutorReserve
          MetricValue: "1"
          Unit: Count

  TutorSettleMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TutorLogGroup
      FilterPattern: '"tutorSettle"'
      MetricTransformations:
        - MetricNamespace: QuantumTutor
          MetricName: TutorSettle
          MetricValue: "1"
          Unit: Count

  TutorOrphanReserveAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-tutor-orphan-reserve
      AlarmDescription: >-
        An hour ended with more tutorReserve lines than tutorSettle lines: a
        debit was taken and never settled or refunded — usually a Lambda
        timeout or OOM between the two. Find the tutorReserve entries without
        a matching tutorSettle (same sub) in /aws/lambda/quantum-tutor and
        refund manually. A reserve/settle pair split across the hour boundary
        false-fires once; verify before refunding.
      Metrics:
        - Id: reserves
          MetricStat:
            Metric:
              Namespace: QuantumTutor
              MetricName: TutorReserve
            Period: 3600
            Stat: Sum
          ReturnData: false
        - Id: settles
          MetricStat:
            Metric:
              Namespace: QuantumTutor
              MetricName: TutorSettle
            Period: 3600
            Stat: Sum
          ReturnData: false
        - Id: orphans
          # FILL: a missing settle series must read as 0, not as "insufficient
          # data" — notBreaching would swallow exactly the real orphan case.
          Expression: "FILL(reserves, 0) - FILL(settles, 0)"
          Label: reserves without a settle
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # Day-wide backstop: the hourly alarm compares line COUNTS, so a real orphan
  # can be masked by an unrelated settle landing in the same hour from a
  # reserve taken the hour before, and a boundary-split pair can false-fire.
  # Over a day the splits cancel and real orphans accumulate past cancellation.
  TutorOrphanReserveDailyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-tutor-orphan-reserve-daily
      AlarmDescription: >-
        A UTC day ended with more tutorReserve lines than tutorSettle lines.
        Unlike the hourly alarm, boundary splits cancel in this window, so a
        breach here is almost certainly a real stranded reservation. Pair the
        tutorReserve/tutorSettle lines by sub in /aws/lambda/quantum-tutor and
        refund the unmatched reserves.
      Metrics:
        - Id: reserves
          MetricStat:
            Metric:
              Namespace: QuantumTutor
              MetricName: TutorReserve
            Period: 86400
            Stat: Sum
          ReturnData: false
        - Id: settles
          MetricStat:
            Metric:
              Namespace: QuantumTutor
              MetricName: TutorSettle
            Period: 86400
            Stat: Sum
          ReturnData: false
        - Id: orphans
          Expression: "FILL(reserves, 0) - FILL(settles, 0)"
          Label: reserves without a settle (day window)
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A failed refund is real money owed a learner — bounded by one generation's
  # worst case, but never just a grep. Matches both emissions by their shared
  # literal stem: tutorRefundFailed and tutorRefundNoWalletRow.
  TutorRefundFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TutorLogGroup
      FilterPattern: '"tutorRefund"'
      MetricTransformations:
        - MetricNamespace: QuantumTutor
          MetricName: TutorRefundFailure
          MetricValue: "1"
          Unit: Count

  TutorRefundFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-tutor-refund-failure
      AlarmDescription: >-
        A settle-path refund failed (tutorRefundFailed) or found no wallet row
        to land on (tutorRefundNoWalletRow). Either way a learner is owed
        credits the system could not return. The log line carries sub and the
        credit amount; credit it manually via the stripe wallet tooling.
      Namespace: QuantumTutor
      MetricName: TutorRefundFailure
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ---- deployed-but-misconfigured metering -----------------------------------
  TutorRateCardMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TutorLogGroup
      FilterPattern: '"rate card missing or invalid"'
      MetricTransformations:
        - MetricNamespace: QuantumTutor
          MetricName: TutorRateCardInvalid
          MetricValue: "1"
          Unit: Count

  TutorRateCardAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-tutor-rate-card-invalid
      AlarmDescription: >-
        A wallet table is configured but the RATE_CARD env var is absent or
        unusable, so every paid-model request is refusing while the deploy
        looks configured. Check the RateCardSecret parameter and the secret's
        {"factor": "..."} shape, then redeploy; scripts/check-rate-parity.mjs
        shows both surfaces' state without printing the value.
      Namespace: QuantumTutor
      MetricName: TutorRateCardInvalid
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  HighInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-tutor-high-invocations-stack
      AlarmDescription: >-
        The tutor Lambda was invoked more than 500 times in an hour —
        possible abuse of the Function URL past the edge WAF, and every
        invocation is a paid model generation. Check the edge WAF metrics
        and consider lowering MaxConcurrency while investigating.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref TutorFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

Outputs:
  TutorUrl:
    Description: Set this as NEXT_PUBLIC_TUTOR_URL in Amplify.
    Value: !GetAtt TutorFunctionUrl.FunctionUrl
  AlertsTopicArn:
    Description: The SNS topic every CloudWatch alarm in this stack notifies.
    Value: !Ref AlertsTopic
