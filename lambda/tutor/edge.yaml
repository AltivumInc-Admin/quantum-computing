AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Edge protection for the "Ask the margin" tutor Function URL: a CloudFront
  distribution (Origin Access Control -> the us-east-2 Lambda Function URL)
  fronted by a WAFv2 rate-based rule that sheds per-IP abuse (HTTP 429) BEFORE it
  can fan out into paid Bedrock generations. CloudFront-scope WAF must live in
  us-east-1, so this is a SEPARATE stack from template.yaml (us-east-2); deploy it
  with the host part of that stack's TutorUrl output as FunctionUrlDomain.
  Caching is disabled so the streamed tutor response is never buffered/cached.

Parameters:
  FunctionUrlDomain:
    Type: String
    Description: >
      Host (no scheme, no path) of the us-east-2 Function URL — the host part of
      the quantum-tutor stack's TutorUrl output, e.g.
      abcd1234.lambda-url.us-east-2.on.aws
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: CloudFront price class (PriceClass_100 = NA/EU edges, cheapest).
  RateLimitPerMinute:
    Type: Number
    Default: 300
    MinValue: 10
    Description: >
      Max NON-PREFLIGHT requests per source IP per 60s before WAF blocks with
      HTTP 429 (see TutorWebAcl's CustomResponse). CORS preflights are excluded
      from the count by the rule's scope-down statement; the rationale is stated
      there. 300/min is orders of magnitude above a real learner yet well below
      scripted abuse.
  AllowedOrigin:
    Type: String
    Default: https://learner.quantumenv.dev
    Description: >
      The browser origin allowed to READ the 429 this WAF returns. Must stay equal
      to the same-named parameter in template.yaml (same default on purpose): the
      Function URL's own Cors.AllowOrigins and the Access-Control-Allow-Origin
      header on the block response are one allowlist expressed in two stacks, and a
      drift between them makes the throttle unreadable in precisely the case it
      exists for. template.yaml lists exactly ONE origin and no localhost entry, so
      this single static header loses nothing that the origin already allows.

Resources:
  # CloudFront-scope WAF web ACL: one per-IP rate-based rule, default Allow.
  TutorWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: quantum-tutor-edge
      Scope: CLOUDFRONT
      Description: Per-IP rate limit for the public tutor endpoint.
      DefaultAction:
        Allow: {}
      # A bare `Block: {}` returns WAF's default 403, which this stack's own prose
      # documented as 429 — and 403 is ALSO what an unsigned direct hit to the
      # AWS_IAM Function URL and a POST missing x-amz-content-sha256 return. That
      # made a throttled learner indistinguishable from a broken OAC signature in
      # both the client and the CloudFront logs. 429 restores the distinction:
      # 429 = you are going too fast, 403 = a signing/auth problem.
      CustomResponseBodies:
        RateLimited:
          ContentType: APPLICATION_JSON
          Content: '{"error":"rate_limited","message":"Too many requests. Wait a minute and try again."}'
      Rules:
        - Name: PerIpRateLimit
          Priority: 0
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: RateLimited
                # A WAF block is generated AT THE EDGE, so the request never reaches
                # the origin and the Function URL's own Cors block never runs — the
                # 429 leaves here with no Access-Control-Allow-Origin at all. The
                # browser is cross-origin to this distribution (NEXT_PUBLIC_TUTOR_URL
                # is the domain in this stack's own Outputs), and ask-tutor.tsx sends
                # `content-type: application/json` plus `x-amz-content-sha256`, so
                # every call is a CORS request. Streaming does not exempt it:
                # res.body.getReader() only runs on a CORS-ok response. Without this
                # header the browser DISCARDS the 429 — fetch rejects with TypeError,
                # res.status is never observed, transportErrorMessage() never runs,
                # and ask-tutor's catch maps TypeError to tutor.unreachable. The
                # learner is told the tutor is down for a wait-a-minute condition,
                # which is the confusion the 429 exists to remove.
                #
                # This value is static, so it can name exactly ONE origin. That is
                # lossless here: template.yaml's AllowedOrigin is a single origin
                # with no localhost entry, so no client that may read a NORMAL
                # response loses the ability to read a THROTTLED one. Only
                # Allow-Origin is needed: the client reads status and body, never a
                # response header, and preflight-only headers (Allow-Headers/
                # Allow-Methods/Max-Age) have no meaning here because the scope-down
                # below keeps this response off preflights entirely.
                ResponseHeaders:
                  - Name: Access-Control-Allow-Origin
                    Value: !Ref AllowedOrigin
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerMinute
              EvaluationWindowSec: 60
              AggregateKeyType: IP
              # CORS preflights are exempt from this rule's count AND its block.
              # A preflight must answer with an ok (2xx) status to succeed — 429 is
              # not one, and NO header can rescue it, so a blocked preflight fails
              # the whole request as a network error and the Allow-Origin above
              # would never be seen. CloudFront forwards OPTIONS (AllowedMethods
              # below), so a burst that trips the limit would otherwise block the
              # preflight too. Excluding OPTIONS is what makes that 429 reachable by
              # a browser at all.
              #
              # Who answers the preflight once it is exempt is UNCHANGED by this
              # edit: the ACL already defaults to Allow, so a non-throttled OPTIONS
              # takes exactly this path today. It is signed by the OAC (SigningBehavior
              # always) and accepted by the AWS_IAM Function URL, whose own Cors block
              # answers it at the front door without invoking the function. Verified
              # live against this distribution on 2026-07-26: OPTIONS with an Origin
              # and Access-Control-Request-Method returned 200 with
              # access-control-allow-origin/-methods/-headers, `x-cache: Miss from
              # cloudfront` (so it reached the origin, not an edge response) and an
              # empty body — the handler always writes bytes, so it was not invoked.
              # The body-hash requirement does not bite: OAC rejects UNSIGNED PAYLOADS
              # on requests that HAVE a body, and a preflight has none (browsers never
              # send x-amz-content-sha256 on an OPTIONS, they only list it in
              # Access-Control-Request-Headers).
              #
              # The cost, honestly: OPTIONS is no longer rate limited per IP by this
              # rule, so preflights become an unbounded request class on the one
              # distribution whose job is bounding spend. The Function URL's own CORS
              # answers them, so there is NO Lambda invoke and therefore no Bedrock or
              # model spend — but CloudFront per-request fees DO still apply, so this
              # is cheap, not free. Two tutor-specific notes the QPU stack does not
              # share: (1) this ACL has no managed rule group, so unlike the QPU edge
              # an exempted OPTIONS is left inspected by no WAF rule at all here;
              # (2) the live Function URL config carries no Access-Control-Max-Age
              # — template.yaml asks for 3600 but PR #176's template changes were
              # never deployed to the us-east-2 stack — so browsers fall back to a
              # 5s preflight cache and OPTIONS runs roughly 1:1 with POST. Deploying
              # template.yaml lands MaxAge and shrinks the class this exemption
              # unmeters; do it alongside this stack. The money path — POST, which is what invokes
              # Bedrock — stays fully counted. The inversion fails closed: anything
              # not EXACTLY "OPTIONS", including a lowercase spoof, still matches and
              # is still rate limited.
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    ByteMatchStatement:
                      FieldToMatch:
                        Method: {}
                      PositionalConstraint: EXACTLY
                      SearchString: OPTIONS
                      TextTransformations:
                        - Priority: 0
                          Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: quantumTutorRateLimit
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: quantumTutorEdgeAcl

  # OAC that signs every CloudFront->origin request with SigV4 so the Function URL
  # can be locked to AWS_IAM (no public direct access). Origin type 'lambda'.
  TutorOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: quantum-tutor-oac
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  TutorDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: quantum-tutor edge (WAF per-IP rate limit + OAC)
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        WebACLId: !GetAtt TutorWebAcl.Arn
        Origins:
          - Id: TutorFunctionUrlOrigin
            DomainName: !Ref FunctionUrlDomain
            OriginAccessControlId: !GetAtt TutorOAC.Id
            # Lambda Function URLs are HTTPS-only. The read timeout covers the
            # 60s Lambda Timeout so a long streamed answer isn't cut off.
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: TutorFunctionUrlOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Managed-CachingDisabled: never cache the dynamic streamed response.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewerExceptHostHeader: forward content-type, Origin, and
          # x-amz-content-sha256 to the origin, but NOT Host (OAC sets the Host to
          # the Function URL domain and signs against it).
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  DistributionDomainName:
    Description: Set https://<this>/ as NEXT_PUBLIC_TUTOR_URL in Amplify.
    Value: !GetAtt TutorDistribution.DomainName
  DistributionId:
    Description: Use in the OAC grant (scripts/grant-oac.sh) and CloudWatch.
    Value: !Ref TutorDistribution
  WebAclArn:
    Description: The CLOUDFRONT-scope WAF web ACL ARN (us-east-1).
    Value: !GetAtt TutorWebAcl.Arn
