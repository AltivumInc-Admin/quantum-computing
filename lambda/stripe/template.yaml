AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  quantum-stripe: billing for the Quantum Learner credit wallet. One HTTP API
  v2 Lambda with three Cognito-authorized routes (POST /checkout, POST /portal,
  GET /wallet) and one PUBLIC, Stripe-signature-verified route (POST /webhook)
  that is the sole writer of credits and tier. One DynamoDB table holds pk-
  prefixed rows (WALLET#<sub>, EVENT#<id> with TTL); money -> credits is exactly
  once via a conditional TransactWriteItems. Stripe keys arrive from Secrets
  Manager at deploy time (never in the template or on the CLI). Deploy in
  us-east-2 (the Cognito pool's region).

Parameters:
  NamePrefix:
    Type: String
    Default: quantum-stripe
    Description: >
      Prefix for every physical, account-unique name in this stack (the wallet
      table, the function, the SNS topic, all seven alarms). It exists so the
      SAME template can be deployed a second time as a sandbox stack in this
      account and region, which is where payment and credit-issuance changes get
      exercised before they touch real money.

      CHANGING THIS ON THE LIVE STACK REPLACES THE WALLET TABLE. CloudFormation
      does not rename resources — a new TableName is a new table, and the old one
      (DeletionPolicy: Retain) is orphaned with every purchased balance still in
      it while the stack serves an empty replacement. The default is pinned to
      the live names by template.test.mjs for exactly that reason. For a sandbox,
      pass quantum-stripe-sandbox; never edit the default.
  MetricNamespace:
    Type: String
    Default: QuantumStripe
    Description: >
      CloudWatch namespace for this stack's money-path metrics. Parameterized
      alongside NamePrefix because the alarms below carry NO dimensions: two
      stacks publishing UncreditedInvoice into one namespace means a sandbox
      refund test pages the operator about live money, and worse, trains them to
      ignore the topic. The sandbox stack must pass its own namespace.
  UserPoolId:
    Type: String
    Default: us-east-2_aRydPmAjj
    Description: The existing quantum-workspace Cognito user pool.
  UserPoolClientId:
    Type: String
    Default: 2sg8nejrf2j8p28j6khjil99ir
    Description: The quantum-workspace-web app client (JWT audience).
  SiteOrigin:
    Type: String
    Default: https://learner.quantumenv.dev
    Description: Production origin allowed by CORS and used for Checkout return URLs.
  StripeSecretName:
    Type: String
    Default: quantum-stripe
    Description: >
      Name of the Secrets Manager secret holding the Stripe keys as JSON
      { "secretKey": "sk_...", "webhookSecret": "whsec_..." }. Only the NAME is
      referenced here; the function reads the value at runtime with its own
      least-privilege role, so the plaintext never enters the template, git, or
      any command line. Provision the secret from 1Password before deploy
      (see README).
  MaxConcurrency:
    Type: Number
    Default: 10
    Description: Reserved concurrency — a hard ceiling on cost and abuse.
  LogRetentionInDays:
    Type: Number
    Default: 30
  AlertEmail:
    Type: String
    Default: christian.perez@altivum.io
    Description: >
      Operator email for the human notification path. Receives every CloudWatch
      alarm in this stack. The SNS email subscription must be confirmed once
      from the inbox before it delivers.

Resources:
  WalletTable:
    Type: AWS::DynamoDB::Table
    # Purchased credit balances are money the learner paid for — never delete
    # with the stack, and keep point-in-time recovery.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${NamePrefix}-wallet"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      # EVENT#<id> idempotency rows self-expire; WALLET#<sub> rows carry no
      # expiresAt and so are never reclaimed.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: Project, Value: quantum }
        - { Key: Feature, Value: billing }
        - { Key: CostCategory, Value: billing }

  StripeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Billing endpoints are low-volume (a human clicking Subscribe, Stripe
      # delivering a webhook). 10 rps steady / 20 burst never touches real use,
      # and caps a flood at the front door alongside ReservedConcurrentExecutions.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      CorsConfiguration:
        AllowOrigins:
          - !Ref SiteOrigin
          - http://localhost:3000
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
              audience:
                - !Ref UserPoolClientId

  StripeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref NamePrefix
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      # Stripe API round trips (customer + session creation, subscription
      # retrieve) push past sync's 10s; 15s leaves headroom without inviting hangs.
      Timeout: 15
      ReservedConcurrentExecutions: !Ref MaxConcurrency
      Environment:
        Variables:
          TABLE_NAME: !Ref WalletTable
          SITE_ORIGIN: !Ref SiteOrigin
          # Only the secret's NAME — never its value. The function fetches the
          # Stripe keys at runtime (see the GetSecretValue policy below), so the
          # plaintext is never an environment variable and never visible via
          # GetFunctionConfiguration.
          SECRET_ID: !Ref StripeSecretName
      Policies:
        - Statement:
            # TransactWriteItems checks the per-item actions; GetItem/PutItem/
            # UpdateItem cover every access this handler makes, scoped to the
            # one table.
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt WalletTable.Arn
            # Read exactly the one Stripe secret (the -* suffix matches the
            # random 6-char suffix Secrets Manager appends to the ARN).
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${StripeSecretName}-*"
      Events:
        Checkout:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeApi
            Method: POST
            Path: /checkout
        Portal:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeApi
            Method: POST
            Path: /portal
        Wallet:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeApi
            Method: GET
            Path: /wallet
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeApi
            Method: POST
            Path: /webhook
            # Stripe cannot present a Cognito JWT — this route is public and
            # authenticated in-handler by the Stripe-Signature HMAC. It is the
            # ONLY route excluded from the default authorizer.
            Auth:
              Authorizer: NONE
      Tags:
        Project: quantum
        Feature: billing
        CostCategory: billing

  StripeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${StripeFunction}
      RetentionInDays: !Ref LogRetentionInDays

  # ---- Human notification path (pattern from lambda/sync + lambda/qpu) ----
  # This stack takes real money and grants the credits it buys, so silent
  # failure is unacceptable: a throwing function may drop a paid webhook (a
  # learner charged but not credited), sustained throttling turns buyers away,
  # and a 5xx on /webhook means Stripe is retrying into a wall.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${NamePrefix}-alerts"
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  StripeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-errors"
      AlarmDescription: >-
        The quantum-stripe function threw at least one error in 5 minutes. A
        paid checkout webhook may have failed to grant credits (Stripe will
        retry, but investigate). Check the function's log group.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ---- Money paths that return 200 and therefore trip NO metric on their own ----
  # Both filters below watch a console.error emitted inside a SUCCESSFUL request.
  # AWS/Lambda Errors counts failed invocations and the 5xx alarm watches HTTP
  # status, so neither can see these: without a log metric filter, a buyer can be
  # silently uncredited and nothing pages. The FilterPattern is a quoted literal
  # phrase pinned by template.test.mjs to a string that literally appears in
  # index.mjs, so editing the log line reddens instead of silently disconnecting
  # the alarm (the lambda/qpu orphaned-row idiom).

  UncreditedInvoiceMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref StripeLogGroup
      # The UMBRELLA phrase, not one branch's literal — the grant-side mirror of
      # the shared clawback phrase below. Five branches end a settled purchase
      # without moving the wallet (a session with no client_reference_id,
      # a top-up with no usable metadata.credits, an invoice whose subscription
      # id or userId will not resolve, and a subscription with no parseable
      # credits); pinning one literal watched exactly one of them.
      FilterPattern: '"credits NOT granted"'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: UncreditedInvoice
          MetricValue: "1"
          Unit: Count

  UncreditedInvoiceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-uncredited-invoice"
      AlarmDescription: >-
        A settled purchase was NOT credited — the buyer paid and their balance
        did not move. One of: a Checkout Session with no client_reference_id, a
        top-up session with no usable metadata.credits, an invoice with no
        resolvable subscription id, a subscription with no metadata.userId, or
        one with no parseable metadata.credits. Every one of those routes
        answers 200, so Stripe treats the event as delivered and will never
        retry: each needs a manual grant. The subscription-id case is the exact
        failure that shipped once already (the id moved under
        parent.subscription_details) and went unnoticed because nothing watched
        for it.
      Namespace: !Ref MetricNamespace
      MetricName: UncreditedInvoice
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # A rare-event alarm: no traffic must not page. (Contrast the QPU
      # reconciler's dead-man alarm, which is `breaching` precisely because
      # silence there means the schedule stopped firing.)
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  SignatureRejectedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref StripeLogGroup
      FilterPattern: '"stripe-webhook: signature verification failed"'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: SignatureRejected
          MetricValue: "1"
          Unit: Count

  SignatureRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-signature-rejected"
      AlarmDescription: >-
        Stripe delivered a webhook whose signature did not verify. Treat this as
        OUR secret being wrong, not an attacker: the overwhelmingly likely cause
        is a signing secret that was rotated without the function picking it up,
        and while it lasts EVERY event is dropped — no credits granted, no
        refunds clawed back. Neither of the other alarms can see it: the
        invocation SUCCEEDS (so AWS/Lambda Errors is blind) and the response is
        a 4xx (so the 5xx alarm is blind). Verified on 2026-08-17 by rotating a
        sandbox secret: 24 invocations, wallet untouched, and not one log line
        until this filter existed.
        FIRST CHECK: does the function hold the current secret? A warm container
        caches it at cold start, so a rotation needs an
        `update-function-configuration` to recycle the environment.
      Namespace: !Ref MetricNamespace
      MetricName: SignatureRejected
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  AsyncPaymentFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref StripeLogGroup
      FilterPattern: '"delayed payment failed; nothing granted"'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: AsyncPaymentFailed
          MetricValue: "1"
          Unit: Count

  AsyncPaymentFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-async-payment-failed"
      AlarmDescription: >-
        A delayed-notification payment (Klarna / Cash App / Amazon Pay / ACH)
        failed after the Checkout Session completed. Nothing was granted, which
        is correct — but a learner believes they bought something, so this is
        the signal to check whether they need help completing the purchase. Not
        an outage; do not treat a single occurrence as an incident.
      Namespace: !Ref MetricNamespace
      MetricName: AsyncPaymentFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ONE filter for every branch where money went back to the customer but the
  # credits could not be reclaimed — a missing/malformed grant row, an
  # unresolvable payment_intent, an unhandled money-shaped event type. All of
  # them end their message with the same literal phrase, so a branch added
  # later is covered without touching this template.
  UnreclaimedRefundMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref StripeLogGroup
      FilterPattern: '"credits NOT reclaimed"'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: UnreclaimedRefund
          MetricValue: "1"
          Unit: Count

  UnreclaimedRefundAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-unreclaimed-refund"
      AlarmDescription: >-
        Money went back to a customer (refund or lost dispute) but the credits
        it bought could NOT be reclaimed automatically — most likely a charge
        with no grant row, or a subscription whose PaymentIntent never
        resolved. The learner keeps credits the platform has refunded. Find the
        payment_intent on the log line and adjust the wallet by hand.
      Namespace: !Ref MetricNamespace
      MetricName: UnreclaimedRefund
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # The catch-all fault. For a GRANT this self-heals (Stripe retries), but a
  # CLAWBACK fault that outlives Stripe's retry window is permanent money loss,
  # so this needs eyes even though it looks like a generic 500.
  WebhookHandlerFaultMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref StripeLogGroup
      FilterPattern: '"webhook handling failed"'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: WebhookHandlerFault
          MetricValue: "1"
          Unit: Count

  WebhookHandlerFaultAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-webhook-fault"
      AlarmDescription: >-
        The webhook handler threw. Stripe will retry, so a single occurrence on
        a GRANT path usually self-heals — but check the event type on the log
        line: a CLAWBACK fault that persists past Stripe's retry window is
        permanent, because nothing else will ever reclaim those credits.
      Namespace: !Ref MetricNamespace
      MetricName: WebhookHandlerFault
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  StripeThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-throttles"
      AlarmDescription: >-
        The quantum-stripe function was throttled (reserved concurrency
        exhausted) in the last 5 minutes. Either real traffic outgrew
        MaxConcurrency or something is flooding the API. A throttled webhook is
        a delayed credit grant. Check request counts before raising the ceiling.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-5xx"
      AlarmDescription: >-
        The billing HTTP API returned at least one 5xx in 5 minutes (v2 metric
        name is 5xx, not 5XXError). The function, its DynamoDB access, or the
        JWT authorizer is failing server-side; checkouts and webhook grants are
        being lost while this persists.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref StripeApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

Outputs:
  BillingUrl:
    Description: Set as NEXT_PUBLIC_BILLING_URL in the Amplify app environment.
    Value: !Sub https://${StripeApi}.execute-api.${AWS::Region}.amazonaws.com
  WebhookUrl:
    Description: >-
      Register this exact URL as the endpoint in the Stripe Dashboard (Developers
      -> Webhooks); its signing secret is the webhookSecret half of the
      Secrets Manager secret.
    Value: !Sub https://${StripeApi}.execute-api.${AWS::Region}.amazonaws.com/webhook
  TableName:
    Value: !Ref WalletTable
  AlertsTopicArn:
    Description: The SNS topic every CloudWatch alarm in this stack notifies.
    Value: !Ref AlertsTopic
