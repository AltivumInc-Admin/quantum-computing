AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  quantum-analytics: a daily count of who actually reached the host named by the
  SiteHost parameter below (learner.quantumenv.dev today).
  Amplify's GenerateAccessLogs serves roughly one day per call and refuses wider
  windows, so history only exists if something collects it daily. This reads the
  previous day's access logs, classifies each visitor, and writes ONE row of
  aggregate counts — never an address, a user agent or a request URL, and
  nothing that links one day to another. What was read is stored as a curriculum
  identifier from a fixed checked-in allowlist (curriculum.mjs), never as a
  path. Nothing is added to the browser: no analytics script, no tracking
  cookie, no beacon, no visitor identifier, and the privacy policy discloses
  these daily counts in both locales under "What we store". Deploy in us-east-2.

Parameters:
  AmplifyAppId:
    Type: String
    Default: d2o7mzaq4cktxf
    Description: The QL-Prod Amplify app serving learner.quantumenv.dev.
  AmplifyDomain:
    Type: String
    Default: quantumenv.dev
    Description: >
      The DOMAIN ASSOCIATION, which is the apex — passing a subdomain such as
      learner.quantumenv.dev returns NotFoundException. The subdomain is
      filtered inside the handler by x-host-header, via SiteHost below. Both
      move together on a domain migration: the association selects whose logs
      are fetched, SiteHost selects which rows in them are ours.
  SiteHost:
    Type: String
    Default: learner.quantumenv.dev
    Description: >
      The x-host-header value that counts as our traffic. A stale value does
      not skew the report, it ZEROES it (the filter drops every row) while the
      job still succeeds and no alarm fires — which is exactly what happened
      from the QL-Prod cutover until 2026-08-31.
  ScheduleExpression:
    Type: String
    Default: cron(30 13 * * ? *)
    Description: >
      Daily, after the previous UTC day has certainly closed. 13:30 UTC also
      keeps it clear of the 13:00 drift workflow.
  MaxConcurrency:
    Type: Number
    Default: 2
    Description: Reserved concurrency — a hard ceiling on cost and abuse.
  LogRetentionInDays:
    Type: Number
    Default: 30
  AlertEmail:
    Type: String
    Default: hq@quantumlearner.dev
    Description: >
      Operator email for the human notification path. Receives every CloudWatch
      alarm in this stack. Each SNS email subscription must be confirmed once
      from the inbox before it delivers.

Resources:
  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    # The only copy of the history. Raw logs age out on AWS's schedule and
    # cannot be re-fetched beyond their retention, so a dropped table is
    # unrecoverable.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: quantum-analytics-daily
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # DELIBERATELY NO TimeToLiveSpecification. TTL is table-wide and keyed on
      # an attribute name, and the wallet table's expiresAt is the standing
      # example of how that deletes rows nobody meant to lose. These rows are a
      # few hundred bytes each and are meant to be permanent: one row per day
      # forever is well under a megabyte a decade.
      Tags:
        - { Key: Project, Value: quantum }
        - { Key: Feature, Value: analytics }
        - { Key: CostCategory, Value: workspace }

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: quantum-analytics
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 512
      # Parsing a day is milliseconds; GenerateAccessLogs plus a ~2 MB download
      # is the slow part. Generous, but bounded by reserved concurrency.
      Timeout: 120
      ReservedConcurrentExecutions: !Ref MaxConcurrency
      Environment:
        Variables:
          TABLE_NAME: !Ref AnalyticsTable
          AMPLIFY_APP_ID: !Ref AmplifyAppId
          AMPLIFY_DOMAIN: !Ref AmplifyDomain
          SITE_HOST: !Ref SiteHost
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AnalyticsTable.Arn
            - Effect: Allow
              Action: amplify:GenerateAccessLogs
              Resource: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Count yesterday's real visitors.
      Tags:
        Project: quantum
        Feature: analytics
        CostCategory: workspace

  AnalyticsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyticsFunction}
      RetentionInDays: !Ref LogRetentionInDays

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: quantum-analytics-alerts
      DisplayName: Quantum analytics
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  AnalyticsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-analytics-errors
      AlarmDescription: >-
        The quantum-analytics function threw. Yesterday's visitor counts were
        not recorded, and that day's access logs will age out of Amplify's
        retention before long. Check the function's log group and re-run it with
        {"day":"YYYY-MM-DD"} once the cause is fixed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyticsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  AnalyticsThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-analytics-throttles
      AlarmDescription: >-
        The quantum-analytics function was throttled, so a scheduled run may
        have been dropped. Check for a stuck concurrent execution.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyticsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # The gap the "did-not-run" alarm below does NOT cover: a run that DID
  # happen, DID succeed, and matched nothing. Error-rate alarms cannot see it —
  # there is no error — and `requests: 0` on its own is indistinguishable from
  # a quiet day, which is exactly how a stale SITE_HOST recorded zeroes here
  # for weeks with every alarm green. The handler emits this line only when the
  # log HAD rows and none matched, so a genuinely quiet day (no rows at all)
  # stays silent and this cannot cry wolf.
  AnalyticsMatchedNothingMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AnalyticsLogGroup
      FilterPattern: '"analytics-matched-nothing"'
      MetricTransformations:
        - MetricNamespace: QuantumAnalytics
          MetricName: MatchedNothing
          MetricValue: "1"
          Unit: Count

  AnalyticsMatchedNothingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-analytics-matched-nothing
      AlarmDescription: >-
        The collector ran, succeeded, and matched ZERO of the rows it fetched:
        traffic exists and none of it looks like ours. Almost always a SiteHost
        that no longer names the host the site serves (check the SiteHost
        parameter against web/src/lib/site.ts), or an AmplifyDomain pointing at
        the wrong association. Reported counts are meaningless until it is
        fixed, and NOTHING else will say so — this is the one alarm standing
        between a wrong identifier and weeks of plausible-looking zeroes.
      Namespace: QuantumAnalytics
      MetricName: MatchedNothing
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # Quiet is healthy here: the metric only exists on a bad day.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # The other silent degradation. ranges() is written to degrade rather than
  # fail — an unreachable prefix list must not cost a whole day — but the run
  # then SUCCEEDS with the datacenter filter switched off entirely, and
  # botFilterComplete on the row is the only trace. Nothing reads a DynamoDB
  # attribute on a schedule, so this pair is what turns it into a notification.
  AnalyticsBotFilterMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AnalyticsLogGroup
      FilterPattern: '"analytics-bot-filter-incomplete"'
      MetricTransformations:
        - MetricNamespace: QuantumAnalytics
          MetricName: BotFilterIncomplete
          MetricValue: "1"
          Unit: Count

  AnalyticsBotFilterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-analytics-bot-filter-incomplete
      AlarmDescription: >-
        The run could not fetch AWS's published prefix list, so the datacenter
        filter did not run at all and that day's `humans` is an OVERCOUNT — every
        cloud-hosted crawler surviving the other signals was counted as a person.
        The run itself succeeded, so no other alarm can see it. The row carries
        botFilterComplete: false and botFilterNote. One bad day is a network
        blip; a run of them means the fetch is broken.
      Namespace: QuantumAnalytics
      MetricName: BotFilterIncomplete
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # Quiet is healthy here: the metric only exists on a degraded day.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # The third silent degradation, and the subtlest: the log arrived and could
  # not be READ. parseLog drops lines it cannot trust and counts them, so a
  # format change that breaks every data line yields no rows, no error, and a
  # row of zeroes that is indistinguishable from a quiet day — matched-nothing
  # cannot see it either, because that needs off-site rows to exist. The handler
  # only emits this above a share of the day's lines, so incidental damage stays
  # quiet and this cannot cry wolf.
  AnalyticsParseDegradedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AnalyticsLogGroup
      FilterPattern: '"analytics-parse-degraded"'
      MetricTransformations:
        - MetricNamespace: QuantumAnalytics
          MetricName: ParseDegraded
          MetricValue: "1"
          Unit: Count

  AnalyticsParseDegradedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-analytics-parse-degraded
      AlarmDescription: >-
        A large share of the day's access-log lines could not be parsed, so the
        counts recorded for it are an UNDERCOUNT — and a wholly unparseable log
        records as a quiet day with no error at all. Almost always a change to
        CloudFront's CSV columns or escaping: compare the header against COLUMNS
        in classify.mjs. The malformed count is on the row.
      Namespace: QuantumAnalytics
      MetricName: ParseDegraded
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # Quiet is healthy here: the metric only exists on a broken day.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  AnalyticsSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-analytics-did-not-run
      AlarmDescription: >-
        The quantum-analytics function has not been invoked in over a day. A
        collector that silently stops looks exactly like a site with no
        visitors, which is the one failure this stack must never produce.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyticsFunction
      Statistic: Sum
      # 26 hours: one daily run, plus slack, so a late run does not page.
      Period: 93600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # The ONLY alarm here that breaches on missing data, deliberately: absent
      # invocations ARE the symptom. Every other alarm treats quiet as healthy.
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertsTopic]

  AnalyticsDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-analytics-slow
      AlarmDescription: >-
        The quantum-analytics function is running close to its 120s timeout.
        Traffic volume or the log download has grown; raise the timeout before
        runs start failing outright.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyticsFunction
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 90000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

Outputs:
  AnalyticsTableName:
    Description: >-
      Read the history with: aws dynamodb scan --table-name quantum-analytics-daily
    Value: !Ref AnalyticsTable
  BackfillCommand:
    Description: >-
      Populate history before this stack existed (reads only; writes no rows).
    Value: node scripts/analytics/backfill.mjs
