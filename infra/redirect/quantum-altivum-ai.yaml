AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Redirect quantum.altivum.ai to https://quantumlearner.dev/ (HTTP 301) via a
  CloudFront Function at viewer-request. INVERSE of quantumlearner-dev.yaml
  for the canonical-domain flip. No www (verified absent). TLS by a
  pre-issued, DNS-validated ACM cert passed in as CertificateArn — this stack
  does NOT create/validate the cert or own DNS records, because
  quantum.altivum.ai's zone is external (Cloudflare), not Route53; see the
  resource comments below for the full reasoning and the manual steps this
  implies at cutover. Includes fail-loud origin + CloudWatch alarms + an SNS
  email + a lean Lambda canary. Deploy in us-east-1, QL-Prod. Requires
  CAPABILITY_IAM (canary role).

Parameters:
  RedirectTarget:
    Type: String
    Default: quantumlearner.dev
    Description: Host to 301-redirect all requests to (scheme is always https).
  CertificateArn:
    Type: String
    Description: >
      ARN of a pre-issued, DNS-validated (via the Cloudflare altivum.ai zone)
      ACM certificate for quantum.altivum.ai, in us-east-1. This stack cannot
      issue or validate the cert itself — see the Description above.
    AllowedPattern: "^arn:aws:acm:us-east-1:[0-9]+:certificate/.+$"
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: CloudFront price class (PriceClass_100 = NA/EU edges, cheapest).
  AlarmEmail:
    Type: String
    Default: hq@quantumlearner.dev
    Description: Email to receive redirect health/alarm notifications (must confirm the SNS subscription).
    AllowedPattern: "[^@]+@[^@]+\\.[^@]+"

Resources:
  # --- TLS: NOT created here, unlike quantumlearner-dev.yaml's in-template
  # --- AWS::CertificateManager::Certificate. quantum.altivum.ai's DNS lives in
  # --- an external Cloudflare zone, not a Route53 hosted zone — there is no
  # --- HostedZoneId this (or any AWS) account can hand to
  # --- DomainValidationOptions to get CloudFormation to write the validation
  # --- CNAME itself and block until issuance the way the stack this inverts
  # --- does. Required: .dev is HSTS-preloaded, so the apex must always answer
  # --- HTTPS with a valid cert. So: request the cert out of band
  # --- (`aws acm request-certificate --region us-east-1 --domain-name
  # --- quantum.altivum.ai --validation-method DNS`), add the returned
  # --- validation CNAME to the Cloudflare altivum.ai zone by hand, wait for
  # --- `aws acm wait certificate-validated`, and pass the resulting ARN in as
  # --- CertificateArn.

  # --- The redirect itself: a viewer-request function returns the 301 before
  # --- CloudFront ever contacts an origin. Preserves path + query string.
  RedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: quantum-altivum-ai-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: 301 quantum.altivum.ai to the canonical platform (path/query preserved)
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var req = event.request;
          var qs = '';
          for (var k in req.querystring) {
            qs += (qs ? '&' : '?') + k;
            if (req.querystring[k].value) { qs += '=' + req.querystring[k].value; }
          }
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: 'https://${RedirectTarget}' + req.uri + qs } }
          };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Redirect quantum.altivum.ai -> quantumlearner.dev (CF Function)
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: [quantum.altivum.ai]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        # FAIL-LOUD origin: intentionally a non-existent host so that if the
        # function association is ever removed, requests 502 (loud, alarmed via
        # 5xxErrorRate) instead of silently proxying a broken clone of the site.
        # In normal operation the function short-circuits and this is never hit.
        Origins:
          - Id: FailLoudOrigin
            DomainName: origin-disabled.quantum.altivum.ai
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: FailLoudOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized (inert; function precedes cache)
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RedirectFunction.FunctionMetadata.FunctionARN

  # --- DNS: deliberately NOT declared here, unlike quantumlearner-dev.yaml's
  # --- AWS::Route53::RecordSetGroup. quantum.altivum.ai's zone is external
  # --- (Cloudflare), so this stack has no Route53 hosted zone to own an alias
  # --- record in. After this stack is up, point quantum.altivum.ai
  # --- (Cloudflare, by hand) at Outputs.DistributionDomainName — that repoint
  # --- IS the flip (spec §5 step 4), and it happens at cutover, not at stack
  # --- creation: this template can be deployed and verified on the raw
  # --- CloudFront domain well before quantum.altivum.ai is pointed at it.

  # --- Alerting: one SNS topic, email subscription (needs manual confirmation).
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: quantum.altivum.ai redirect health

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # --- Native CloudFront alarms (free/default metrics; namespace AWS/CloudFront,
  # --- Region dimension is the literal 'Global'; these must live in us-east-1).
  FunctionExecutionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-altivum-ai-redirect-function-execution-errors
      AlarmDescription: The redirect CloudFront Function threw an execution error.
      Namespace: AWS/CloudFront
      MetricName: FunctionExecutionErrors
      Dimensions:
        - { Name: FunctionName, Value: quantum-altivum-ai-redirect }
        - { Name: Region, Value: Global }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  FunctionValidationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-altivum-ai-redirect-function-validation-errors
      AlarmDescription: The redirect function returned a malformed response object.
      Namespace: AWS/CloudFront
      MetricName: FunctionValidationErrors
      Dimensions:
        - { Name: FunctionName, Value: quantum-altivum-ai-redirect }
        - { Name: Region, Value: Global }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  Distribution5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-altivum-ai-redirect-5xx
      AlarmDescription: >
        Sustained 5xx at the edge — most likely the function association was
        removed and requests are hitting the fail-loud origin (502).
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - { Name: DistributionId, Value: !Ref Distribution }
        - { Name: Region, Value: Global }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # --- Synthetic canary: the catch-all for "runs but 301s to the WRONG place",
  # --- cert/DNS breakage, or a fully-down domain (no requests -> no native
  # --- metrics). A tiny Node Lambda HEADs the hostname every 15 min and emits
  # --- a custom Healthy=1/0 metric; the alarm below pages on 0 or missing data.
  CanaryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: put-redirect-metric
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: QuantumLearner/Redirect

  CanaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: quantum-altivum-ai-redirect-canary
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 20
      Role: !GetAtt CanaryRole.Arn
      Code:
        ZipFile: |
          const { CloudWatchClient, PutMetricDataCommand } = require("@aws-sdk/client-cloudwatch");
          const https = require("https");
          const cw = new CloudWatchClient({});
          const TARGET_PREFIX = "https://quantumlearner.dev";
          const HOSTS = ["quantum.altivum.ai"];

          function check(host) {
            return new Promise((resolve) => {
              const req = https.request(
                { host, path: "/", method: "HEAD", timeout: 5000 },
                (res) => {
                  const loc = res.headers.location || "";
                  resolve({
                    host,
                    ok: res.statusCode === 301 && loc.indexOf(TARGET_PREFIX) === 0,
                    status: res.statusCode,
                    location: loc,
                  });
                  res.resume();
                }
              );
              req.on("error", (e) => resolve({ host, ok: false, error: e.message }));
              req.on("timeout", () => { req.destroy(); resolve({ host, ok: false, error: "timeout" }); });
              req.end();
            });
          }

          exports.handler = async () => {
            const results = await Promise.all(HOSTS.map(check));
            const healthy = results.every((r) => r.ok) ? 1 : 0;
            await cw.send(new PutMetricDataCommand({
              Namespace: "QuantumLearner/Redirect",
              MetricData: [{ MetricName: "Healthy", Value: healthy, Unit: "Count" }],
            }));
            if (!healthy) console.error("redirect UNHEALTHY " + JSON.stringify(results));
            else console.log("redirect healthy " + JSON.stringify(results));
            return { healthy, results };
          };

  CanarySchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: quantum-altivum-ai-redirect-canary-15min
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: canary
          Arn: !GetAtt CanaryFunction.Arn

  CanaryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CanaryFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CanarySchedule.Arn

  RedirectHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quantum-altivum-ai-redirect-health
      AlarmDescription: >
        The canary saw the redirect return something other than a 301 to
        quantumlearner.dev (wrong location / cert / DNS / down), or the canary
        itself stopped reporting.
      Namespace: QuantumLearner/Redirect
      MetricName: Healthy
      Statistic: Minimum
      Period: 900
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  DistributionDomainName:
    Description: Point the Cloudflare quantum.altivum.ai record at this at cutover.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  AlertTopicArn:
    Value: !Ref AlertTopic
