AWSTemplateFormatVersion: "2010-09-09"
Description: >
  quantum-hq-foundations: shared services for the Quantum Learner OU, deployed
  to the Quantum Learner - HQ account (us-east-1). Holds the quantumlearner.dev
  hosted zone — AUTHORITATIVE since 2026-08-28, when the domain's registration
  and NS delegation moved here — and the OU-level consolidated budget.
  The zone's records are managed operationally, NOT declared here: a template
  that owns the MX record owns the mail path for four AWS accounts' root
  addresses, and a stack rollback would take it down with it.

Parameters:
  AlertEmail:
    Type: String
    Default: hq@quantumlearner.dev
    Description: Budget notifications. hq@ is the business/automated address.
  MonthlyOuBudget:
    Type: Number
    Default: 200
    Description: Consolidated monthly USD ceiling across the Quantum Learner OU.

Resources:
  QuantumLearnerZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: quantumlearner.dev
      HostedZoneConfig:
        Comment: Authoritative for quantumlearner.dev since 2026-08-28. Live infrastructure.

  OuBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyOuBudget
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

Outputs:
  HostedZoneId:
    Value: !Ref QuantumLearnerZone
    Export: { Name: quantum-hq-zone-id }
