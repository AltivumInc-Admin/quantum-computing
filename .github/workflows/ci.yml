name: CI

# Gate every PR and every push to main on the full test + lint + build-smoke
# matrix. main is intended to be a protected branch with the jobs below
# (python, web, lambdas, build-smoke) as required status checks, so Amplify
# only ever auto-builds a commit that has already passed CI.
#
# The lambdas job matrixes over every Lambda in lambda/ (keep the matrix list
# AND the ci-standby mirror in sync with `ls lambda/` — nothing derives it) and
# runs each one's node --test suite. This is load-bearing: the qpu Lambda's
# tests guard the real-money spend ledger (costMicros, the cap demux, the
# compensating-refund split) and the stripe Lambda's tests guard the credit
# wallet (exactly-once grants, the public-but-signed webhook route, Secrets
# Manager key handling) — nothing else in CI executes either.
#
# Version pinning: keep PYTHON_VERSION / NODE_VERSION aligned with the Amplify
# build image (Amplify console -> App settings -> Build settings / build logs).
# Python is pinned to 3.12 because openfermionpyscf/pyscf (the [full] extra)
# ship wheels for 3.12; newer interpreters may lack them.

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # MUST be .[dev,full] (not .[dev]) or the pytest.importorskip tests
          # for pennylane / openfermion silently skip and CI is green-but-blind.
          pip install -e ".[dev,full]"
          # qcsim is a separate package the parity + contract tests import; it
          # is NOT installed by the root project, so install it explicitly.
          pip install -e ./qcsim

      # make test = pytest tests/, which includes BOTH notebook engines:
      #   - tests/test_notebook_contract.py: every browser-runnable notebook
      #     executes under qcsim (the Pyodide stand-in), and
      #   - tests/test_notebook_real_sdk.py: a representative sample executes
      #     under the REAL amazon-braket-sdk with no qcsim bootstrap — the
      #     engine `make setup` installs locally. This tier exists because a
      #     qcsim-only idiom (e.g. `sv = circuit.state_vector()`) can be fully
      #     green under the contract tests yet crash for every local learner.
      - name: Run tests
        run: make test

      - name: Lint
        run: make lint

      # Drift gate: the committed manifests must match a fresh scan, so the
      # curriculum catalog (sections.ts), the runnable Run-button gate, and the
      # qcsim wheel pin can never silently diverge from the notebooks on disk.
      - name: Check content manifests are in sync
        run: python scripts/validate_runnable.py --check

  web:
    name: Web tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog guard diffs the pull request against its base. On a
          # pull_request event the checkout is a merge commit whose FIRST parent
          # is the base, so depth 2 is the minimum that makes HEAD^1 resolvable
          # — the default depth-1 clone has no base to diff against, and the
          # guard would exit 2 rather than silently pass.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Operator scripts that move money. Deliberately a STEP of this job, not
      # a job of its own: a new job means a new required-status context, which
      # means a branch-protection change, and a money guard that is awkward to
      # add is a money guard someone skips. Zero dependencies — the issuer
      # takes its DynamoDB client by injection, so `node --test` needs no
      # node_modules and there is nothing to install.
      - name: Founding-credit issuance tests
        working-directory: .
        run: node --test scripts/founding-credit/*.test.mjs

      # Another money-adjacent operator script: rewrites learner rows onto new
      # Cognito subs during the QL-Prod migration. Same rationale as the step
      # above — zero dependencies, DynamoDB clients taken by injection — so
      # `node --test` needs no node_modules here either.
      - name: Sub-remap migration tests
        working-directory: .
        run: node --test scripts/migration/*.test.mjs

      # Unit tests for the guard's own matching rules. Zero dependencies — pure
      # functions over path strings, so `node --test` needs no node_modules.
      # Its own glob: the founding-credit line above matches only that directory.
      - name: Changelog guard tests
        working-directory: .
        run: node --test scripts/changelog/*.test.mjs

      # The deployed-vs-git guard's own rules: what counts as source, which
      # drift is HELD, when a hold has gone stale, and what a run exits with
      # when several of those are true at once. The scripts themselves need AWS
      # and cannot run here — the rules do not, which is why they were split
      # out. Zero dependencies, same as the three steps above.
      - name: Drift guard tests
        working-directory: .
        run: node --test scripts/drift/*.test.mjs

      # A learner-visible pull request must say what changed, or record in
      # SILENT why it needs no announcement. The diff is computed HERE rather
      # than inside the script: no script under scripts/ shells out to git, the
      # repo's only other git assertion is a workflow step (the lab-config pin
      # in build-smoke), and keeping git out of the script is what leaves its
      # rules unit-testable with no repository.
      #
      # pull_request only — a push to main has no base to diff against.
      #
      # `shell: bash` is load-bearing, not decoration: the default runner shell
      # is `bash -e {0}`, WITHOUT pipefail, so a failing `git diff` would be
      # swallowed and the step's status would be node's alone. Naming the shell
      # turns on `-o pipefail`, which is what makes the git half of this pipeline
      # able to fail the build. The guard still fails closed either way — an
      # empty stdin exits 2 — but that is one layer, and this is meant to be two.
      #
      # core.quotePath=false: git otherwise C-quotes any path holding non-ASCII
      # bytes, and the leading quote makes isLearnerVisible() miss a prefix it
      # should have matched. No such path is tracked today; the flag costs
      # nothing and the failure mode is silent.
      - name: Changelog guard
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: git -c core.quotePath=false diff --name-only HEAD^1 HEAD | node scripts/changelog/check.mjs

  lambdas:
    name: Lambda tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # EVERY directory under lambda/ must be listed here AND in the standby
        # mirror (infra/ci-standby/template.yaml buildspec loop). The stripe
        # entry was missed for three weeks after lambda/stripe landed — the one
        # Lambda that moves real money merged ungated the whole time.
        dir: [tutor, qpu, sync, review-email, stripe, analytics]
    defaults:
      run:
        working-directory: lambda/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: lambda/${{ matrix.dir }}/package-lock.json

      # Each Lambda has its own deps + lockfile; node --test imports the handler,
      # which imports its AWS SDK clients at module top, so install first.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build-smoke:
    name: JupyterLite + static export build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # build.sh creates its own .venv and downloads the Pyodide kernel; cache
      # both to keep the smoke build fast.
      # Cache the two things that are expensive AND self-contained: the pip venv
      # and the version-keyed Pyodide tarball under .cache/.
      #
      # NOT .jupyterlite.doit.db. That is doit's incremental-build state, and it
      # only tells the truth when the build OUTPUT it describes is still on disk.
      # CI never caches the output (web/public/lab is rebuilt every run), so a
      # restored db always describes a tree that isn't there — doit then skips
      # tasks it believes are done. On 2026-07-30 that skipped
      # `jupyterlite-pyodide-kernel-pyodide:patch:jupyter-lite.json`, producing a
      # lab config with an EMPTY pyodideUrl; the same-origin assertion in
      # finalize_lab.py caught it, but the failure surfaced on an unrelated PR and
      # would have shipped a lab that cannot boot its kernel. Caching a build
      # database without its outputs is never sound — don't add it back.
      #
      # Key is versioned because dropping a path does not stop an EXISTING cache
      # archive from restoring that file; only a new key gives a clean tree.
      #
      # -v3 (2026-08-19): the -v2 archive holds a .venv built against a Python
      # patch the runner image no longer ships, so its bin/ shebangs point at a
      # missing interpreter and pip exits 127. build.sh now detects and rebuilds
      # an unusable venv, which makes the build green either way — but on a key
      # HIT nothing new is saved, so it would rebuild from scratch on every run
      # forever. Bumping the key stores one good archive and ends that.
      - name: Cache JupyterLite build environment
        uses: actions/cache@v4
        with:
          path: |
            web/jupyterlite-build/.venv
            web/jupyterlite-build/.cache
          key: jupyterlite-v3-${{ runner.os }}-${{ hashFiles('web/jupyterlite-build/requirements.txt', 'qcsim/**/*.py', 'qcsim/pyproject.toml') }}

      - name: Build JupyterLite distribution (qcsim wheel -> Pyodide)
        run: bash web/jupyterlite-build/build.sh

      # build.sh regenerates the committed jupyter_lite_config.json from the actual
      # wheel name; assert the committed pin matches so a qcsim version bump can't
      # silently leave a stale kernel pin (and catches accidental hand-edits).
      - name: Assert committed lab config matches build.sh output
        run: git diff --exit-code -- web/jupyterlite-build/jupyter_lite_config.json

      # The lesson runtime self-hosts Pyodide under /pyodide/. Assert it was staged,
      # its version matches the runtime constant (no self-host/runtime drift), and
      # the {micropip, numpy} wheel closure the runtime needs is present — without
      # these wheels the same-origin boot would 404 and silently fall back to CDN.
      - name: Assert self-hosted Pyodide matches the runtime version + closure
        run: |
          test -f web/public/pyodide/pyodide.js || { echo "self-hosted pyodide.js missing"; exit 1; }
          ver=$(grep -oE 'PYODIDE_VERSION *= *"[0-9.]+"' web/src/lib/pyodide-runtime.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          # The distribution's package.json carries the release version. Do NOT
          # check pyodide-lock.json's info.version: the upstream 0.29.0 core
          # tarball ships a lock stamped "0.28.0.dev0" (unstamped dev version),
          # which would false-fail a correct self-host.
          python3 -c "import json,sys; v=json.load(open('web/public/pyodide/package.json'))['version']; sys.exit(0 if v == '$ver' else 'self-hosted pyodide '+v+' != runtime $ver')"
          # Assert the STABLE closure roots only (micropip is always loadPackage'd;
          # numpy is qcsim's dependency). Transitive deps are computed from the lock
          # by build.sh and may change across Pyodide versions, so we don't pin them.
          for w in micropip numpy; do
            ls web/public/pyodide/$w-*.whl >/dev/null 2>&1 || { echo "missing closure root wheel: $w"; exit 1; }
          done
          echo "self-hosted Pyodide $ver OK (core + micropip/numpy dependency closure)"

      # The in-browser LAB kernel (JupyterLite) self-hosts its OWN Pyodide under
      # public/lab/static/pyodide/ (a different pin from the lesson runtime above) and
      # bundles the comm wheel into the same-origin piplite index, so a "Run in
      # Browser" never touches cdn.jsdelivr.net or pypi.org. Assert that wiring; the
      # Playwright smoke below also asserts ZERO third-party requests at runtime, but
      # this catches a broken self-host before paying for the browser run.
      - name: Assert the LAB kernel is wired fully same-origin
        run: |
          base=web/public/lab/static/pyodide
          test -f "$base/pyodide.js" || { echo "lab self-hosted pyodide.js missing"; exit 1; }
          # Closure roots: the kernel-boot packages that resolve via the Pyodide lock
          # (sqlite3, ipython, jedi) + micropip + the curriculum notebook imports
          # (numpy, matplotlib). Transitive deps are computed from the lock by build.sh.
          for w in micropip sqlite3 ipython jedi numpy matplotlib; do
            ls "$base/$w"-*.whl >/dev/null 2>&1 || { echo "missing lab closure root wheel: $w"; exit 1; }
          done
          # comm must be bundled in the local piplite index (else the kernel fetches it
          # from pypi.org on every boot — pyodide_kernel hard-imports it).
          python3 -c "import json,sys; d=json.load(open('web/public/lab/pypi/all.json')); sys.exit(0 if 'comm' in d else 'comm missing from local piplite index')"
          # The kernel must point at the self-hosted Pyodide and never fall back to PyPI.
          # Single-line python (semicolons) to avoid YAML/Python indentation pitfalls.
          python3 -c "import json,sys; d=json.load(open('web/public/lab/jupyter-lite.json')); s=d.get('jupyter-config-data',d); ks=s['litePluginSettings']['@jupyterlite/pyodide-kernel-extension:kernel']; u=ks.get('pyodideUrl',''); assert 'jsdelivr' not in u and u.startswith('./'), 'pyodideUrl not same-origin: '+repr(u); assert ks.get('disablePyPIFallback') is True, 'disablePyPIFallback not set'; print('lab kernel same-origin OK: pyodideUrl='+u)"
          echo "LAB self-host OK (Pyodide + closure + comm, no third-party CDN)"

      - name: Build static export
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Assert build artifacts exist
        run: |
          test -d web/out || { echo "missing web/out (static export)"; exit 1; }
          test -d web/public/lab || { echo "missing web/public/lab (JupyterLite)"; exit 1; }
          echo "Build artifacts present: web/out/ and web/public/lab/"

      # The math + syntax-highlight pipeline is observed NOWHERE else: every Jest
      # suite that loads the renderer mocks react-markdown, remark-math,
      # rehype-katex and rehype-highlight into no-ops, so they assert only that
      # strings are forwarded. Deleting a plugin from the array, dropping a macro
      # from KATEX_MACROS, or a breaking option-shape change in a major bump all
      # ship fully green without this step. Same grep-the-built-artifact idiom as
      # the Pyodide/lab assertions above.
      #
      # Patterns are BARE CLASS NAMES, deliberately not `class="katex"`: lesson
      # pages sit behind the sign-up wall, so their content ships in the exported
      # RSC payload (`className\":\"katex\"`) rather than as prerendered HTML.
      # Matching the class name alone holds for both shapes.
      - name: Assert the KaTeX + syntax-highlight render path ran
        run: |
          page=web/out/learn/01-foundations.html
          test -f "$page" || { echo "missing $page"; exit 1; }
          grep -q 'katex-html' "$page" || { echo "no KaTeX visual output — remark-math/rehype-katex regressed"; exit 1; }
          grep -q 'katex-mathml' "$page" || { echo "no MathML tree — screen readers get nothing from the math"; exit 1; }
          # A rendered ket bracket proves the SHARED KATEX_MACROS table expanded
          # \ket{...}, not just that KaTeX ran on something.
          grep -q '⟩' "$page" || { echo "no rendered ket glyph — KATEX_MACROS regressed"; exit 1; }
          # The wrapper class AND a token class: the first proves rehype-highlight
          # visited the fence, the second that it actually tokenized it.
          grep -q 'hljs' "$page" || { echo "no hljs fences — rehype-highlight regressed"; exit 1; }
          grep -q 'hljs-' "$page" || { echo "fences carry no token spans — highlighting produced nothing"; exit 1; }
          # rehype-katex 7 never aborts the build on a malformed expression: it
          # catches its own ParseError and emits a red .katex-error span, so a
          # broken formula ships silently (one did, on /learn/02-hardware, in the
          # sentence teaching the project's cost discipline). No page may ship one.
          if grep -rl 'katex-error' web/out --include='*.html'; then
            echo "katex-error span(s) shipped in the static export — see the page(s) above"; exit 1
          fi
          echo "Render path OK: katex + mathml + \\ket macro + hljs present, zero katex-error"

      # Real in-browser smoke: run a browser-runnable notebook under actual Pyodide
      # + the local qcsim wheel and assert its deterministic output. Reuses the
      # web/out/ + web/public/lab/ this job already built (no second build).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright (chromium)
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Pyodide in-browser smoke
        working-directory: web
        env:
          CI: "true"
        run: npx playwright test
