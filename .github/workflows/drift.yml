name: Deploy drift

# Is what is RUNNING what is in git?
#
# The failure this exists for is "merged but never deployed": CI green, PR closed,
# CloudFormation reading UPDATE_COMPLETE from the PREVIOUS deploy, and production quietly
# a week behind. Nothing in a normal pipeline looks at the deployed artifact, so nothing
# catches it. This does, once a day, whether or not anyone opens a PR.
#
# Deliberately NOT a pull-request check: drift appears at merge time, not at PR time, so a
# PR gate would block unrelated work for a deploy someone else owes. Scheduled instead, so
# the signal lands on the person who can act on it.
#
# Requires the quantum-ci-drift-check role (infra/github-oidc-drift-role.yaml) and the
# AWS_DRIFT_ROLE_ARN repository variable. If either is absent the job skips rather than
# failing, so this file can merge before the role exists.
#
# Set DRIFT_EXPECT_ACCOUNT as a second repository variable, naming the account this
# report is supposed to describe. The checked function names exist in more than one
# account, so without it a green run cannot say which one it read.

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily — mid-morning US Eastern
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to request the OIDC token; nothing else

concurrency:
  group: drift
  cancel-in-progress: true

jobs:
  drift:
    name: Deployed-vs-git drift
    runs-on: ubuntu-latest
    # Eleven package downloads and roughly two dozen API calls; a minute is
    # typical. A cap means a hung child fails visibly instead of holding the
    # concurrency group until GitHub's six-hour default expires.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The ARN goes through env rather than being interpolated into the script body.
      # It is a repository variable (admin-set, not attacker-controlled), so this is not
      # closing a live hole — it is the documented safe pattern, and it costs nothing.
      - name: Check the role is configured
        id: cfg
        env:
          ROLE_ARN: ${{ vars.AWS_DRIFT_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "AWS_DRIFT_ROLE_ARN is not set — deploy infra/github-oidc-drift-role.yaml"
            echo "and add the role ARN as a repository variable. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assume the read-only drift role
        if: steps.cfg.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: quantum-drift-check

      # DRIFT_EXPECT_ACCOUNT pins WHICH account the report describes: the same
      # function names exist in more than one, so a green run that cannot name
      # its account is not evidence. Same skip-cleanly-if-unset shape as the
      # role above — unset prints "account unverified" and the job still runs.
      # The variable holds an account number, which is why it is a repository
      # variable and not a literal in this file.
      #
      # The exit code is recorded, not just the pass/fail: 1 means somebody owes
      # a deploy, 2 means the check could not read what it needed. The failure
      # annotation below says the right one instead of always blaming a deploy.
      - name: Compare every deployed Lambda against this commit
        id: lambda
        if: steps.cfg.outputs.ready == 'true'
        shell: bash
        env:
          DRIFT_EXPECT_ACCOUNT: ${{ vars.DRIFT_EXPECT_ACCOUNT }}
        run: |
          set +e
          node scripts/check-lambda-drift.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Compare the deployed rate configuration across pricing functions
        # Runs even when code drift failed above (mid-cutover, code drift is the
        # normal state — exactly when rate parity matters most). Value-blind by
        # construction: the script prints presence and MATCH/MISMATCH, never the
        # value and never a digest of it, so it is safe in a public Actions log.
        id: parity
        if: always() && steps.cfg.outputs.ready == 'true'
        shell: bash
        env:
          DRIFT_EXPECT_ACCOUNT: ${{ vars.DRIFT_EXPECT_ACCOUNT }}
        run: |
          set +e
          node scripts/check-rate-parity.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Explain a failure
        if: failure() && steps.cfg.outputs.ready == 'true'
        shell: bash
        env:
          DRIFT_CODE: ${{ steps.lambda.outputs.code }}
          PARITY_CODE: ${{ steps.parity.outputs.code }}
        run: |
          if [ "$DRIFT_CODE" = "1" ]; then
            echo "::error::Production does not match main. Deploy the drifted functions, or"
            echo "::error::record why they are intentionally behind (the HELD list). Run"
            echo "::error::'make drift' locally for the same report. Merging is not shipping."
          elif [ "$DRIFT_CODE" = "2" ]; then
            echo "::error::The drift check could not READ some functions — credentials,"
            echo "::error::permissions, or a function that no longer exists. It says nothing"
            echo "::error::about whether production matches main. Read the row's reason."
          fi
          if [ "$PARITY_CODE" = "1" ]; then
            echo "::error::The two pricing functions do not carry consistent rate"
            echo "::error::configuration (rule 5). See the parity step's output."
          elif [ "$PARITY_CODE" = "2" ]; then
            echo "::error::Rate parity could not be checked."
          fi
