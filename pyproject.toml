[project]
name = "quantum-braket-workspace"
version = "0.1.0"
description = "Amazon Braket quantum computing learning workspace"
requires-python = ">=3.10"
dependencies = [
    "amazon-braket-sdk>=1.80",
    "amazon-braket-default-simulator>=1.25",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    # Notebook execution is ~98% of this suite's wall clock and every run is an
    # out-of-process Jupyter kernel, so the suite is almost entirely idle-waiting
    # and parallelises nearly linearly. `make test` runs it at -n auto with
    # --dist=loadgroup; the scheduler is what makes that SAFE, not what makes it
    # faster. See the ini section below for why the flag is not in addopts.
    "pytest-xdist>=3.5",
    # Pin below 0.16: 0.16.0 tightens RUF100/default rules and fails make lint
    # on pre-existing test-only noqa noise when CI pip-installs latest.
    "ruff>=0.5,<0.16",
    "pip-tools>=7.0",
    "nbstripout>=0.7",
    # Notebook-contract test (tests/test_notebook_contract.py): execute every
    # browser-runnable notebook headlessly under qcsim. ipywidgets is bundled
    # by JupyterLite in the browser, so the local/CI test env needs it too.
    "nbclient>=0.10",
    "ipykernel>=6.29",
    # Pin below 9.17: IPython 9.17.0 makes get_ipython a lazy module attribute,
    # so amazon-braket-sdk's ipython_utils.running_in_jupyter() KeyErrors on
    # sys.modules["IPython"].__dict__["get_ipython"] and every AWS-touching
    # notebook fails in CI (which pip-installs latest; local venvs were older).
    # Same class of pin as ruff above. Lift when braket-sdk handles the lazy attr.
    "ipython<9.17",
    "ipywidgets>=8.1",
]
full = [
    "pennylane>=0.38",
    "amazon-braket-pennylane-plugin>=1.30",
    "openfermion>=1.6",
    "openfermionpyscf>=0.5",
    "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks are taught content with a standard import preamble; they are
# executed/validated by tests/test_notebook_contract.py, not linted as source.
extend-exclude = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NO addopts. --dist=loadgroup is a correctness requirement of this suite (see
# notebook_group() in tests/conftest.py), so putting it here is the obvious
# move — and it is wrong, because addopts is parsed before any plugin check:
# `pytest -m "not slow"` in an environment without pytest-xdist then dies with
# `error: unrecognized arguments: --dist=loadgroup`, naming this file and not
# the missing package. That environment is not hypothetical — it is every
# developer .venv created before xdist joined the dev extra above.
#
# So the flag lives on the Makefile's command line, and tests/conftest.py
# refuses to run distributed under any other scheduler. That guard is the part
# that cannot be forgotten; the flag is just how you satisfy it. Setting
# `config.option.dist` from a conftest hook LOOKS like a cleaner fix and does
# not work: the value is read again in each worker (xdist/remote.py
# `setup_config`), so the mark is silently ignored and the group splits across
# workers. Measured, not assumed — two tests in one group landed on gw0/gw1.
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
